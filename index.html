<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4-Skills Test</title>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
  <div class="container">
    
    <form>
      <img src="OBMC LOGO 2024-Circle.png">
      <h1>Login</h1>
      <label for="user">Username</label>
      <input type="text" class="form-control" id="uname" name="uname">
      <br>
      <label for="pass">Password</label>
      <input type="text" class="form-control" id="pwd" name="pwd">
      <br>

      <button type="button" class="btn btn-primary" onclick="authenticate()">Sign In</button>
      <button type="button" class="btn btn-success" onclick="window.location.reload()">Refresh</button> 
    </form>

    <p id="display" class="text-danger mt-2"></p>
          
  </div>  
  <script src="main.js"></script>

</body>
</html>
